# Host Nginx config for izinet (Reality Fallback + Web + WS Fallback)
# Managed by Antigravity

server {
    listen 3443 ssl default_server;
    server_name izinet.online www.izinet.online vpn.izinet.online one.izinet.online ws.izinet.online;
    ssl_certificate /etc/letsencrypt/live/izinet.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/izinet.online/privkey.pem; # managed by Certbot
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Backend-Server "izinet-app" always;

    # VLESS WebSocket Fallback for blocked ISPs
    location /izinet-ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Main Web App & Subscription API
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name izinet.online www.izinet.online vpn.izinet.online one.izinet.online ws.izinet.online;
    return 301 https://$host$request_uri;
}
